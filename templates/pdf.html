<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<style>
/* === Page setup === */
/* CDP handles page size and margins via printToPDF options */

/* === Reset === */
html, body {
    margin: 0;
    padding: 0; /* CDP printToPDF handles margins */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 11pt;
    line-height: 1.6;
    color: #333;
}

/* === Markdown content styles === */
.content h1 {
    font-size: 20pt;
    margin-top: 0;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid #333;
}

.content h2 {
    font-size: 17pt;
    margin-top: 24px;
    margin-bottom: 12px;
    padding-bottom: 4px;
    border-bottom: 1px solid #eee;
}

.content h3 {
    font-size: 14pt;
    margin-top: 20px;
    margin-bottom: 10px;
}

.content h4, .content h5, .content h6 {
    font-size: 12pt;
    margin-top: 16px;
    margin-bottom: 8px;
}

.content p {
    margin: 0 0 12px 0;
}

.content a {
    color: #0366d6;
    text-decoration: none;
}

.content strong {
    font-weight: 600;
}

.content em {
    font-style: italic;
}

/* === Code blocks === */
.content code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 9pt;
    background-color: #f6f8fa;
    padding: 2px 5px;
    border-radius: 3px;
}

.content pre {
    background-color: #f6f8fa;
    border: 1px solid #e1e4e8;
    border-radius: 4px;
    padding: 12px;
    overflow-x: auto;
    margin-bottom: 16px;
}

.content pre code {
    background-color: transparent;
    padding: 0;
    font-size: 9pt;
    line-height: 1.4;
}

/* === Tables === */
.content table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 16px;
    font-size: 10pt;
}

.content th, .content td {
    padding: 6px 10px;
    border: 1px solid #ddd;
    text-align: left;
}

.content th {
    background-color: #f6f8fa;
    font-weight: 600;
}

.content tr:nth-child(even) {
    background-color: #fafbfc;
}

/* === Lists === */
.content ul, .content ol {
    margin-bottom: 12px;
    padding-left: 24px;
}

.content li {
    margin-bottom: 4px;
}

.content li > ul, .content li > ol {
    margin-bottom: 0;
}

/* === Blockquotes === */
.content blockquote {
    margin: 0 0 16px 0;
    padding: 8px 16px;
    border-left: 4px solid #dfe2e5;
    color: #6a737d;
    background-color: #f6f8fa;
}

/* === Horizontal rule === */
.content hr {
    height: 2px;
    margin: 24px 0;
    border: 0;
    background-color: #e1e4e8;
}

/* === Images === */
.content img {
    max-width: 100%;
    margin-bottom: 16px;
}

/* === Print color adjustment === */
html {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
}
</style>
</head>
<body translate="no">

<!-- Main content -->
<div class="content">
{{CONTENT}}
</div>

</body>
</html>
